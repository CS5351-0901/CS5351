name: Ownership guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  ownership:
    name: Check ownership
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base (never execute PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch proposed PR head as data
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-check-$PR_NUMBER"
          test "$(git rev-parse "refs/remotes/origin/pr-check-$PR_NUMBER")" = "$PR_HEAD_SHA"
      - name: Enforce paths and shared function ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_pr_ownership.py \
            --base "$BASE_SHA" \
            --head "refs/remotes/origin/pr-check-$PR_NUMBER" \
            --branch "$PR_BRANCH" \
            --author "$PR_AUTHOR" \
            --head-repo "$PR_HEAD_REPO" \
            --expected-head-sha "$PR_HEAD_SHA"
